<!DOCTYPE html>
<!-- views/sin_permiso.html : página amable para el error 403 -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Academia Horizonte — Sin permiso</title>
<style>
  /* Paleta institucional: azul marino #14213D y dorado #B8923D */
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f4;
  }
  .caja {
    background: white;
    width: 420px;
    max-width: 90%;
    border-top: 5px solid #B8923D;
    border-radius: 8px;
    box-shadow: 0 2px 10px #ccc;
    padding: 30px;
    text-align: center;
  }
  .codigo { color: #B8923D; font-size: 48px; font-weight: bold; line-height: 1; }
  h1 { color: #14213D; font-size: 22px; margin: 15px 0 10px; }
  .mensaje { color: #555; font-size: 15px; margin: 0 0 20px; }
  /* Recuadro con los datos de la sesión actual */
  .datos-sesion {
    background: #f8fafc;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    text-align: left;
  }
  .datos-sesion p { margin: 5px 0; color: #333; }
  .etiqueta-rol {
    display: inline-block;
    background: #1565c0;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    text-transform: uppercase;
  }
  .etiqueta-rol.rol-admin { background: #B8923D; }
  .botones { display: flex; gap: 10px; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
  }
  .btn-principal { background: #14213D; color: white; }
  .btn-principal:hover { background: #24365e; }
  .btn-salir { background: #B8923D; color: white; }
  .btn-salir:hover { background: #9a7a32; }
</style>
</head>
<body>

<div class="caja">
  <div class="codigo">403</div>
  <h1>Esta sección es solo para administradores</h1>
  <p class="mensaje">
    Tu usuario no tiene permiso para entrar aquí, pero puedes volver al
    tablero o cerrar la sesión.
  </p>

  <!-- Datos de la sesión con la que se intentó entrar -->
  <div class="datos-sesion">
    <p><strong>Correo:</strong> {{ session.get('correo', 'Sin sesión') }}</p>
    <p>
      <strong>Rol:</strong>
      <span class="etiqueta-rol rol-{{ session.get('rol', '') }}">
        {{ session.get('rol', 'Sin rol') }}
      </span>
    </p>
  </div>

  <div class="botones">
    <a class="btn btn-principal" href="{{ url_for('tablero.index') }}">Volver al tablero</a>
    <a class="btn btn-salir" href="{{ url_for('sesion.salir') }}">Salir</a>
  </div>
</div>

</body>
</html>
